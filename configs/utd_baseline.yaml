data:
  data_dir: "data/utd_mhad/processed"
  batch_size: 32
  num_workers: 2
  target_frames: 64
  num_classes: 27
  num_nodes: 20
  augment: true

model:
  in_channels: 3
  num_classes: 27
  num_nodes: 20
  dropout: 0.1
  channel_plan: "compact"

training:
  epochs: 70
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.005
  label_smoothing: 0.1
  lr_scheduler: "cosine"
  min_lr: 1.0e-5
  seed: 42
  device: "cuda"
  checkpoint_dir: "outputs/checkpoints"
  checkpoint_name: "stgcn_utd_baseline.pt"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"
